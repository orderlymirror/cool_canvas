<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Cool Canvas</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: url('images/hero_banner.png') center/cover; position: relative; }
    .auth-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10,0,21,0.6); backdrop-filter: blur(10px); }
    .auth-box { position: relative; z-index: 1; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 450px; }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header h1 { font-size: 2rem; margin-bottom: 10px; }
    .auth-header p { color: var(--gray); }
    .auth-form .form-group { margin-bottom: 20px; }
    .auth-form label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; }
    .auth-form input { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg); color: var(--text); outline: none; transition: var(--transition); }
    .auth-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.1); }
    .auth-btn { width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 10px; }
    .auth-footer { margin-top: 25px; text-align: center; font-size: 0.9rem; color: var(--gray); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .back-home { position: absolute; top: 30px; left: 30px; z-index: 2; color: white; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 500; }
    .back-home:hover { transform: translateX(-5px); }
  </style>
</head>
<body>

<a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

<div class="auth-page">
  <div class="auth-overlay"></div>
  <div class="auth-box">
    <div class="auth-header">
      <div class="logo" style="justify-content:center; margin-bottom:15px;">
        <span class="logo-icon">🎨</span>
        <span class="logo-text">Cool<span class="logo-accent">Canvas</span></span>
      </div>
      <h1>Welcome Back</h1>
      <p>Enter your details to access your account.</p>
    </div>
    
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••"/>
      </div>
      <div style="text-align:right; margin-bottom:20px;">
        <a href="#" style="font-size:0.8rem; color:var(--gray);">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary auth-btn">Log In</button>
      
      <div style="margin-top:15px; padding:15px; background:var(--bg); border-radius:8px; border:1px solid var(--border); font-size:0.8rem; text-align:center;">
        <strong>Demo Accounts:</strong><br>
        User: any email/pass<br>
        Vendor: <em>vendor@test.com</em> / <em>password</em>
      </div>
    </form>
    
    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    
    if (login(email, pass)) {
      showToast('Login successful!');
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || 'index.html';
      setTimeout(() => { window.location.href = redirect; }, 1000);
    } else {
      showToast('Login failed. Check your credentials.');
    }
  });
</script>
</body>
</html>
