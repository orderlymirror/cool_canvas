<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Cool Canvas</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: url('images/hero_banner.png') center/cover; position: relative; padding: 50px 20px; }
    .auth-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10,0,21,0.6); backdrop-filter: blur(10px); }
    .auth-box { position: relative; z-index: 1; background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header h1 { font-size: 2rem; margin-bottom: 10px; }
    .auth-header p { color: var(--gray); }
    .auth-form .form-group { margin-bottom: 20px; }
    .auth-form label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; }
    .auth-form input, .auth-form select { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg); color: var(--text); outline: none; transition: var(--transition); }
    .auth-form input:focus, .auth-form select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.1); }
    .auth-btn { width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 10px; }
    .auth-footer { margin-top: 25px; text-align: center; font-size: 0.9rem; color: var(--gray); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .back-home { position: absolute; top: 30px; left: 30px; z-index: 2; color: white; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 500; }
    .back-home:hover { transform: translateX(-5px); }
    .role-select { display: flex; gap: 15px; margin-bottom: 20px; }
    .role-option { flex: 1; border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; transition: var(--transition); }
    .role-option.active { border-color: var(--primary); background: rgba(157, 78, 221, 0.05); color: var(--primary); font-weight: 600; }
    .role-option i { font-size: 1.5rem; margin-bottom: 10px; display: block; }
  </style>
</head>
<body>

<a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

<div class="auth-page">
  <div class="auth-overlay"></div>
  <div class="auth-box">
    <div class="auth-header">
      <div class="logo" style="justify-content:center; margin-bottom:15px;">
        <span class="logo-icon">🎨</span>
        <span class="logo-text">Cool<span class="logo-accent">Canvas</span></span>
      </div>
      <h1>Create an Account</h1>
      <p>Join the art community today.</p>
    </div>
    
    <form class="auth-form" id="signupForm">
      <label style="margin-bottom:10px;">I want to...</label>
      <div class="role-select">
        <div class="role-option active" data-role="user" onclick="setRole('user')">
          <i class="fas fa-shopping-bag"></i>
          Buy Art
        </div>
        <div class="role-option" data-role="vendor" onclick="setRole('vendor')">
          <i class="fas fa-palette"></i>
          Sell Art
        </div>
      </div>
      <input type="hidden" id="role" value="user"/>
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="John Doe"/>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6"/>
      </div>
      
      <button type="submit" class="btn-primary auth-btn">Sign Up</button>
    </form>
    
    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  function setRole(role) {
    document.getElementById('role').value = role;
    document.querySelectorAll('.role-option').forEach(el => el.classList.remove('active'));
    document.querySelector(`.role-option[data-role="${role}"]`).classList.add('active');
  }

  document.getElementById('signupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    const role = document.getElementById('role').value;
    
    if (signup(name, email, pass, role)) {
      showToast('Account created successfully!');
      setTimeout(() => { window.location.href = role === 'vendor' ? 'vendor.html' : 'index.html'; }, 1000);
    }
  });
</script>
</body>
</html>
